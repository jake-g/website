name: CI Pipeline

on:
  push:
    branches: [ gh-pages ]
  pull_request:
    branches: [ gh-pages ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'processing/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow beautifulsoup4

    - name: Run unit tests
      run: |
        make -C processing test

    - name: Verify build minification compiles
      run: |
        make -C processing minify
